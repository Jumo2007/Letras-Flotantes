<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canto.LComp</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0607">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0607;--ink:#f1e6d0;--red:#b3122b;--gold:#d9a441;--dim:#8b7f6e;--panel:rgba(16,9,11,.94);--line:#3a1a20;--txt:#d9a441}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 65%,#2c0a11 0%,var(--bg) 68%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.line{position:absolute;left:50%;top:40%;width:max-content;max-width:84vw;text-align:center;transform:translate(-50%,-50%);font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:clamp(1.8rem,5vw,3.6rem);line-height:1.25;color:var(--txt);text-shadow:0 0 calc(22px + var(--p,0) * 34px) var(--txt),0 0 3px rgba(0,0,0,.9);transition:opacity .8s,filter .8s}
.line.out{opacity:0;filter:blur(6px)}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0;animation:ch .55s ease-out forwards}
@keyframes ch{0%{opacity:0;filter:blur(8px);transform:translateY(12px)}100%{opacity:1;filter:blur(0);transform:none}}
@media (prefers-reduced-motion:reduce){.ch{animation:none;opacity:1}}
#bg{transform-origin:center;position:fixed;inset:0;z-index:-2;overflow:hidden;background:#000}
#bg img,#bg video{width:100%;height:100%;object-fit:cover;display:block}
#shade{position:fixed;inset:0;z-index:-1;background:#000;opacity:.45;pointer-events:none}
.line.instant{animation:pop .25s ease-out}
.line.instant .ch{animation:none;opacity:1}
@keyframes pop{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
select{font:inherit;font-size:.9rem;color:var(--ink);background:#120809;border:1px solid var(--line);border-radius:4px;padding:.4rem .5rem}
#list{display:flex;flex-direction:column;gap:.35rem;margin-top:.6rem;max-height:30vh;overflow:auto}
.song{display:flex;gap:.4rem}
.song .pl{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song.on .pl{border-color:var(--gold);color:var(--gold)}
#hint{position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:var(--dim);font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:1.4rem;padding:2rem;pointer-events:none}
#hint.gone{display:none}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:.75rem 1rem;display:flex;flex-direction:column;gap:.6rem;transition:opacity .5s;max-height:80vh;overflow:auto}
#bar.hide{opacity:0;pointer-events:none}
#bar{touch-action:pan-y}
body{touch-action:none}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
button,.btn{font:inherit;font-size:.9rem;color:var(--ink);background:#1d0d11;border:1px solid var(--line);border-radius:4px;padding:.45rem .8rem;cursor:pointer}
button:hover,.btn:hover{border-color:var(--red)}
button.main{background:var(--red);border-color:var(--red)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
audio{flex:1 1 240px;min-width:200px;height:36px}
input[type=text],textarea{font:inherit;font-size:.9rem;color:var(--ink);background:#120809;border:1px solid var(--line);border-radius:4px;padding:.45rem .6rem}
input[type=text]{flex:1 1 140px;min-width:0}
textarea{width:100%;min-height:120px;resize:vertical}
details summary{cursor:pointer;color:var(--gold);font-size:.9rem}
details .row,details textarea{margin-top:.6rem}
output{min-width:3.6rem;text-align:center;font-variant-numeric:tabular-nums}
#status{font-size:.85rem;color:var(--dim);min-height:1.2em}
.lbl{font-size:.85rem;color:var(--dim)}
</style>
</head>
<body>
<div id="bg"></div>
<div id="shade"></div>
<div id="stage"></div>
<div id="hint">Agrega canciones a la biblioteca o abre un MP3</div>

<div id="bar">
 <div class="row">
  <label class="btn">Abrir MP3 suelto<input type="file" id="mp3" accept="audio/*" hidden></label>
  <audio id="a" controls></audio>
  <label class="lbl">Color <input type="color" id="col" value="#d9a441" style="vertical-align:middle;background:none;border:0;width:2rem;height:1.6rem;padding:0"></label>
  <label class="lbl">Texto <select id="spd"><option value="0">Instantáneo</option><option value="0.3">Rápido</option><option value="1" selected>Normal</option></select></label>
  <span class="lbl">Desfase</span>
  <button id="less" title="Letras antes (tecla [)">−0,5 s</button>
  <output id="off">0,0 s</output>
  <button id="more" title="Letras después (tecla ])">+0,5 s</button>
  <button id="fs">Pantalla completa</button>
 </div>

 <details id="lib" open>
  <summary>Biblioteca <span id="usage" class="lbl"></span></summary>
  <div class="row">
   <label class="btn">Agregar canciones<input type="file" id="addf" accept="audio/*" multiple hidden></label>
   <button id="prev" title="Anterior" aria-label="Anterior">⏮</button>
   <button id="next" title="Siguiente" aria-label="Siguiente">⏭</button>
   <button id="savecur" class="main" hidden>Guardar canción abierta</button>
   <label class="lbl">Al terminar <select id="mode"><option value="seq">Siguiente</option><option value="shuf">Aleatoria</option><option value="one">Repetir</option><option value="stop">Detener</option></select></label>
  </div>
  <div id="list"></div>
 </details>

 <div class="row">
  <label class="btn">Fondo (foto o video)<input type="file" id="bgf" accept="image/*,video/*" hidden></label>
  <button id="bgx">Quitar fondo</button>
  <label class="lbl">Oscurecer <input type="range" id="shd" min="0" max="90" value="45" style="vertical-align:middle"></label>
 </div>

 <details id="fx">
  <summary>Estilo y efectos</summary>
  <div class="row">
   <label class="lbl">Pulso con la música <input type="range" id="pulse" min="0" max="100" value="50" style="vertical-align:middle"></label>
   <label class="lbl"><input type="checkbox" id="wake" checked> Mantener pantalla encendida</label>
  </div>
  <div class="row">
   <select id="sty" aria-label="Estilos guardados"></select>
   <button id="savesty">Guardar estilo actual</button>
   <button id="delsty">Borrar estilo</button>
  </div>
 </details>

 <div class="row">
  <button id="savebg">Guardar fondo</button>
  <select id="mybg" aria-label="Mis fondos"></select>
  <button id="delbg">Borrar fondo guardado</button>
 </div>

 <details id="adj">
  <summary>Ajustar fondo</summary>
  <div class="row">
   <label class="lbl">Ajuste <select id="fit"><option value="cover">Rellenar</option><option value="contain">Completa</option><option value="fill">Estirar</option></select></label>
   <label class="lbl">Zoom <input type="range" id="zoom" min="100" max="300" value="100"></label>
   <label class="lbl">← → <input type="range" id="px" min="0" max="100" value="50"></label>
   <label class="lbl">↑ ↓ <input type="range" id="py" min="0" max="100" value="50"></label>
   <button id="rst">Restablecer</button>
  </div>
  <div class="lbl" style="margin-top:.5rem">También puedes arrastrar el fondo con el dedo o el mouse.</div>
 </details>

 <details id="lyr" open>
  <summary>Letras</summary>
  <div class="row">
   <input type="text" id="artist" placeholder="Artista" aria-label="Artista">
   <input type="text" id="title" placeholder="Canción" aria-label="Canción">
   <button class="main" id="find">Buscar letra sincronizada</button>
  </div>
  <div class="row">
   <label class="btn">Cargar archivo .lrc<input type="file" id="lrc" accept=".lrc,.txt" hidden></label>
   <button id="dl">Descargar .lrc</button>
  </div>
 </details>

 <details>
  <summary>Sincronizar yo mismo</summary>
  <textarea id="raw" placeholder="Pega aquí la letra, una línea por renglón"></textarea>
  <div class="row">
   <button class="main" id="startSync">Empezar sincronización</button>
   <button id="tap" hidden>Marcar línea (Espacio)</button>
  </div>
 </details>

 <div id="status" role="status">Pon el MP3, escribe artista y canción, y busca la letra.</div>
</div>

<script>
const $ = s => document.querySelector(s);
const a = $('#a'), stage = $('#stage'), bar = $('#bar');
let lines = [], idx = 0, offset = 0, lrcText = '', sync = null;
let curSong = null, songs = [], audioUrl = null, saveT;
let bgs = [], curBg = null, looseFile = null;
const say = t => $('#status').textContent = t;
const fmtOff = () => (offset >= 0 ? '+' : '−') + Math.abs(offset).toFixed(1).replace('.', ',') + ' s';
const fmt = t => { const m = Math.floor(t / 60); return String(m).padStart(2, '0') + ':' + (t - m * 60).toFixed(2).padStart(5, '0'); };

/* ---------- Letras ---------- */
function parseLRC(txt) {
  const out = [];
  for (const row of txt.split(/\r?\n/)) {
    const tags = [...row.matchAll(/\[(\d+):(\d+(?:[.,]\d+)?)\]/g)];
    const text = row.replace(/\[[^\]]*\]/g, '').trim();
    if (!tags.length || !text) continue;
    for (const m of tags) out.push({ t: +m[1] * 60 + parseFloat(m[2].replace(',', '.')), text });
  }
  return out.sort((x, y) => x.t - y.t);
}
function setLyrics(txt, save = true) {
  lrcText = txt;
  lines = parseLRC(txt);
  reseek();
  $('#hint').classList.toggle('gone', lines.length > 0);
  if (save) saveMeta();
}
function reseek() {
  const t = a.currentTime - offset;
  idx = lines.findIndex(l => l.t > t - 0.3);
  if (idx < 0) idx = lines.length;
  stage.innerHTML = ''; cur = null;
}

/* ---------- Efecto: una línea fija, letra por letra ---------- */
let cur = null, lastSlot = null;
const SLOTS = [];
for (const y of [16, 34, 52, 70]) SLOTS.push({ x: 6, y, a: 'left' }, { x: 6, y, a: 'right' });
for (const y of [24, 46, 64]) SLOTS.push({ x: 50, y, a: 'center' });
let lastSign = 1;
function place(d) {
  const narrow = innerWidth < 700;
  const pool = SLOTS.filter(s => s !== lastSlot && (narrow ? s.a === 'center' : (!lastSlot || s.a !== lastSlot.a)));
  const s = pool[Math.floor(Math.random() * pool.length)];
  lastSlot = s;
  d.style.top = s.y + 'vh';
  if (s.a === 'center') {
    const ang = (lastSign = -lastSign) * (8 + Math.random() * 22);
    d.style.maxWidth = narrow ? '80vw' : '60vw';
    d.style.transformOrigin = 'center';
    d.style.transform = 'translate(-50%,-50%) rotate(' + ang.toFixed(1) + 'deg)';
    return;
  }
  /* El extremo libre de la línea se aleja del borde cercano, así nunca se sale de la pantalla */
  const down = s.y < 46 ? 1 : -1;
  const room = (down > 0 ? 100 - s.y : s.y) / 100 * innerHeight * 0.85;
  const maxAng = Math.min(45, Math.asin(Math.min(1, room / (0.42 * innerWidth))) * 180 / Math.PI);
  const mag = 10 + Math.random() * Math.max(0, maxAng - 10);
  const ang = (s.a === 'left' ? down : -down) * mag;
  d.style.maxWidth = '42vw';
  d.style.textAlign = s.a;
  d.style.transformOrigin = s.a + ' center';
  d.style.transform = 'translateY(-50%) rotate(' + ang.toFixed(1) + 'deg)';
  if (s.a === 'left') d.style.left = s.x + 'vw'; else { d.style.left = 'auto'; d.style.right = s.x + 'vw'; }
}
function fadeCur() {
  if (!cur) return;
  const el = cur.el;
  el.classList.add('out');
  setTimeout(() => el.remove(), 900);
  cur = null;
}
function show(i) {
  const l = lines[i], next = lines[i + 1];
  const gap = next ? next.t - l.t : 6;
  fadeCur();
  const d = document.createElement('div');
  d.className = 'line';
  place(d);
  const f = parseFloat($('#spd').value);
  if (f === 0) d.classList.add('instant');
  const typeT = Math.min(Math.max(gap * 0.5, 0.6), 2.4) * f;
  const n = l.text.replace(/\s/g, '').length || 1;
  const step = f === 0 ? 0 : Math.min(0.09, Math.max(0.01, typeT / n));
  let k = 0;
  const words = l.text.split(/\s+/);
  words.forEach((w, wi) => {
    const ws = document.createElement('span');
    ws.className = 'w';
    for (const c of w) {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = c;
      s.style.animationDelay = (k++ * step) + 's';
      ws.appendChild(s);
    }
    d.appendChild(ws);
    if (wi < words.length - 1) d.appendChild(document.createTextNode(' '));
  });
  stage.appendChild(d);
  cur = { el: d, end: l.t + Math.min(gap, 10) };
}
function tick() {
  react();
  const t = a.currentTime - offset;
  let last = -1;
  while (idx < lines.length && lines[idx].t <= t) { last = idx; idx++; }
  if (last >= 0 && t - lines[last].t < 2) show(last);
  if (cur && t >= cur.end) fadeCur();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
/* ---------- Fondo ---------- */
const bg = $('#bg'); let bgUrl = null;
function clearBg() { bg.innerHTML = ''; if (bgUrl) URL.revokeObjectURL(bgUrl); bgUrl = null; }
function showBg(blob, isVideo) {
  clearBg();
  bgUrl = URL.createObjectURL(blob);
  let el;
  if (isVideo) {
    el = document.createElement('video');
    el.src = bgUrl; el.muted = true; el.loop = true; el.preload = 'auto';
    el.setAttribute('playsinline', '');
    if (!a.paused) el.play().catch(() => {});
  } else {
    el = document.createElement('img'); el.src = bgUrl; el.alt = '';
  }
  bg.appendChild(el);
}
$('#bgf').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  const isVideo = f.type.startsWith('video');
  curBg = { id: null, blob: f, isVideo, name: f.name };
  showBg(f, isVideo);
  resetBg();
  if (curSong) {
    try { curSong.bgId = await saveBgToLib(); saveMeta(); say('Fondo guardado en esta canción y en Mis fondos.'); }
    catch (err) { say('Fondo cargado, pero no se pudo guardar.'); }
  } else { renderBgs(); say('Fondo cargado solo para esta sesión. Pulsa "Guardar fondo" para conservarlo.'); }
  e.target.value = '';
};
const bgS = { fit: 'cover', z: 100, x: 50, y: 50 };
const clamp = v => Math.max(0, Math.min(100, v));
function applyBg() {
  const el = bg.firstElementChild;
  if (!el) return;
  el.style.objectFit = bgS.fit;
  el.style.objectPosition = bgS.x + '% ' + bgS.y + '%';
  el.style.transformOrigin = bgS.x + '% ' + bgS.y + '%';
  el.style.transform = 'scale(' + bgS.z / 100 + ')';
}
function syncSliders() { $('#fit').value = bgS.fit; $('#zoom').value = bgS.z; $('#px').value = bgS.x; $('#py').value = bgS.y; }
function resetBg() { Object.assign(bgS, { fit: 'cover', z: 100, x: 50, y: 50 }); syncSliders(); applyBg(); }
$('#fit').onchange = e => { bgS.fit = e.target.value; applyBg(); saveMeta(); };
$('#zoom').oninput = e => { bgS.z = +e.target.value; applyBg(); saveMeta(); };
$('#px').oninput = e => { bgS.x = +e.target.value; applyBg(); saveMeta(); };
$('#py').oninput = e => { bgS.y = +e.target.value; applyBg(); saveMeta(); };
$('#rst').onclick = () => { resetBg(); saveMeta(); };
$('#bgx').onclick = () => {
  clearBg(); curBg = null; renderBgs(); say('Fondo quitado.');
  if (curSong) { curSong.bgId = ''; curSong.bgType = ''; saveMeta(); }
};
$('#shd').oninput = e => { $('#shade').style.opacity = e.target.value / 100; saveSettings(); };
a.addEventListener('play', () => { const v = bg.querySelector('video'); if (v) v.play().catch(() => {}); });
a.addEventListener('pause', () => { const v = bg.querySelector('video'); if (v) v.pause(); });
function setColor(c) { $('#col').value = c; document.documentElement.style.setProperty('--txt', c); }
$('#col').oninput = e => { setColor(e.target.value); saveMeta(); };
a.addEventListener('seeked', reseek);
a.addEventListener('loadedmetadata', reseek);

/* ---------- Cargar MP3 ---------- */
$('#mp3').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  curSong = null; looseFile = f; a.src = URL.createObjectURL(f); renderList();
  const base = f.name.replace(/\.[^.]+$/, '');
  const parts = base.split(' - ');
  if (parts.length >= 2) { $('#artist').value = parts[0].trim(); $('#title').value = parts.slice(1).join(' - ').trim(); }
  else $('#title').value = base;
  say('MP3 cargado. Revisa artista y canción y pulsa Buscar.');
};

/* ---------- Buscar en LRCLIB ---------- */
async function fetchLRC(q) {
  const r = await fetch('https://lrclib.net/api/search?q=' + encodeURIComponent(q));
  const hits = (await r.json()).filter(x => x.syncedLyrics);
  if (!hits.length) return null;
  if (isFinite(a.duration)) hits.sort((x, y) => Math.abs(x.duration - a.duration) - Math.abs(y.duration - a.duration));
  return hits[0];
}
$('#find').onclick = async () => {
  const q = ($('#artist').value + ' ' + $('#title').value).trim();
  if (!q) return say('Escribe artista y canción.');
  say('Buscando…');
  try {
    const hit = await fetchLRC(q);
    if (!hit) return say('No hay letras sincronizadas para esa búsqueda. Prueba otro nombre, carga un .lrc o sincroniza tú mismo.');
    setLyrics(hit.syncedLyrics);
    say('Cargada: ' + hit.artistName + ' – ' + hit.trackName + '. Si sale desfasada, ajusta el desfase.');
  } catch (err) {
    say('No se pudo conectar con LRCLIB. Revisa tu conexión e inténtalo de nuevo.');
  }
};

/* ---------- Archivo .lrc y descarga ---------- */
$('#lrc').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { setLyrics(r.result); say(lines.length ? 'Archivo .lrc cargado (' + lines.length + ' líneas).' : 'El archivo no tiene marcas de tiempo [mm:ss.xx].'); };
  r.readAsText(f);
};
$('#dl').onclick = () => {
  if (!lrcText) return say('Todavía no hay letras para descargar.');
  const l = document.createElement('a');
  l.href = URL.createObjectURL(new Blob([lrcText], { type: 'text/plain' }));
  l.download = ($('#title').value || 'letra') + '.lrc';
  l.click();
};

/* ---------- Desfase ---------- */
function nudge(d) { offset = Math.round((offset + d) * 10) / 10; $('#off').textContent = fmtOff(); reseek(); saveMeta(); }
$('#less').onclick = () => nudge(-0.5);
$('#more').onclick = () => nudge(0.5);

/* ---------- Sincronizar a mano ---------- */
function showNext() { say('Marca cuando empiece: “' + sync.rows[sync.i] + '” (' + (sync.i + 1) + '/' + sync.rows.length + ')'); }
$('#startSync').onclick = () => {
  const rows = $('#raw').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!rows.length) return say('Pega la letra primero.');
  if (!a.src) return say('Carga primero el MP3.');
  sync = { rows, i: 0, out: [] };
  a.currentTime = 0; a.play();
  $('#tap').hidden = false;
  showNext();
};
function tap() {
  if (!sync) return;
  sync.out.push({ t: a.currentTime, text: sync.rows[sync.i++] });
  if (sync.i >= sync.rows.length) {
    const txt = sync.out.map(l => '[' + fmt(l.t) + '] ' + l.text).join('\n');
    sync = null; $('#tap').hidden = true;
    setLyrics(txt); a.currentTime = 0;
    say('Sincronización lista. Si quedó tarde por tu tiempo de reacción, usa el desfase. Puedes descargar el .lrc.');
  } else showNext();
}
$('#tap').onclick = tap;

/* ---------- Biblioteca guardada en el dispositivo (IndexedDB) ---------- */
const DB = new Promise((res, rej) => {
  const r = indexedDB.open('canto', 2);
  r.onupgradeneeded = () => { for (const n of ['songs', 'files', 'bgs', 'bgfiles']) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: 'id' }); };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
function db(stores, mode, fn) {
  return DB.then(d => new Promise((res, rej) => {
    const t = d.transaction(stores, mode);
    const out = fn(...[].concat(stores).map(n => t.objectStore(n)));
    t.oncomplete = () => res(out && out.result);
    t.onerror = t.onabort = () => rej(t.error);
  }));
}
const songName = s => (s.artist ? s.artist + ' – ' : '') + s.title;
function saveMeta() {
  if (!curSong) return;
  const s = curSong, snap = { lrc: lrcText, offset, color: $('#col').value, bgS: { ...bgS } };
  clearTimeout(saveT);
  saveT = setTimeout(() => { Object.assign(s, snap); db('songs', 'readwrite', st => st.put(s)).catch(() => {}); }, 300);
}
async function loadSongs() {
  try { songs = (await db('songs', 'readonly', st => st.getAll())).sort((x, y) => x.added - y.added); }
  catch (err) { songs = []; say('Tu navegador no permite guardar canciones aquí (¿modo privado?).'); }
  renderList();
}
function renderList() {
  $('#savecur').hidden = !(looseFile && !curSong);
  const box = $('#list');
  box.innerHTML = '';
  if (!songs.length) { const p = document.createElement('div'); p.className = 'lbl'; p.textContent = 'Aún no hay canciones. Agrega MP3 para guardarlos en la app.'; box.appendChild(p); }
  for (const s of songs) {
    const row = document.createElement('div');
    row.className = 'song' + (curSong && curSong.id === s.id ? ' on' : '');
    const b = document.createElement('button'); b.className = 'pl'; b.textContent = songName(s); b.onclick = () => playSong(s.id);
    const x = document.createElement('button'); x.textContent = '✕'; x.title = 'Borrar'; x.setAttribute('aria-label', 'Borrar ' + songName(s)); x.onclick = () => delSong(s.id);
    row.append(b, x);
    box.appendChild(row);
  }
  if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => { $('#usage').textContent = '· ' + Math.round(e.usage / 1048576) + ' MB guardados'; }).catch(() => {});
}
$('#addf').onchange = async e => {
  const files = [...e.target.files];
  let n = 0;
  for (const f of files) {
    const id = Date.now() + Math.random().toString(36).slice(2, 6);
    const base = f.name.replace(/\.[^.]+$/, ''), p = base.split(' - ');
    const meta = { id, artist: p.length > 1 ? p[0].trim() : '', title: p.length > 1 ? p.slice(1).join(' - ').trim() : base, lrc: '', offset: 0, color: '#d9a441', bgType: '', bgS: null, tried: false, added: Date.now() + n };
    try { await db(['songs', 'files'], 'readwrite', (m, fl) => { m.put(meta); return fl.put({ id, audio: f, bg: null }); }); songs.push(meta); n++; }
    catch (err) { say('No se pudo guardar "' + f.name + '". Puede que no quede espacio.'); break; }
  }
  e.target.value = '';
  if (n) { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); say(n + (n === 1 ? ' canción guardada.' : ' canciones guardadas.') + ' Tócala en la lista para reproducirla.'); }
  renderList();
};
async function loadBgs() {
  try { bgs = (await db('bgs', 'readonly', st => st.getAll())).sort((x, y) => x.added - y.added); } catch (err) { bgs = []; }
  renderBgs();
}
function renderBgs() {
  const sel = $('#mybg');
  sel.innerHTML = '';
  const o0 = document.createElement('option');
  o0.value = ''; o0.textContent = bgs.length ? 'Mis fondos…' : 'Sin fondos guardados';
  sel.appendChild(o0);
  for (const b of bgs) { const o = document.createElement('option'); o.value = b.id; o.textContent = (b.type === 'video' ? '🎬 ' : '🖼 ') + b.name; sel.appendChild(o); }
  sel.value = curBg && curBg.id ? curBg.id : '';
}
async function saveBgToLib() {
  if (!curBg) return '';
  if (curBg.id) return curBg.id;
  const id = 'bg' + Date.now() + Math.random().toString(36).slice(2, 5);
  const meta = { id, name: curBg.name, type: curBg.isVideo ? 'video' : 'image', added: Date.now() };
  await db(['bgs', 'bgfiles'], 'readwrite', (m, f) => { m.put(meta); return f.put({ id, blob: curBg.blob }); });
  bgs.push(meta); curBg.id = id; renderBgs();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  return id;
}
async function applyBgId(id) {
  const meta = bgs.find(b => b.id === id);
  if (!meta) return false;
  const rec = await db('bgfiles', 'readonly', f => f.get(id));
  if (!rec) return false;
  curBg = { id, blob: rec.blob, isVideo: meta.type === 'video', name: meta.name };
  showBg(rec.blob, curBg.isVideo);
  return true;
}
$('#savebg').onclick = async () => {
  if (!curBg) return say('Primero elige un fondo con "Fondo (foto o video)".');
  try { const id = await saveBgToLib(); if (curSong) { curSong.bgId = id; saveMeta(); } say('Fondo guardado en Mis fondos.'); }
  catch (err) { say('No se pudo guardar el fondo. Puede que no quede espacio.'); }
};
$('#mybg').onchange = async e => {
  const id = e.target.value;
  if (!id) return;
  try {
    if (await applyBgId(id)) { resetBg(); if (curSong) { curSong.bgId = id; saveMeta(); } say('Fondo aplicado.'); }
    else say('No se encontró ese fondo.');
  } catch (err) { say('No se pudo cargar el fondo.'); }
};
$('#delbg').onclick = async () => {
  const id = $('#mybg').value;
  if (!id) return say('Elige un fondo en la lista para borrarlo.');
  const b = bgs.find(x => x.id === id);
  if (!b || !confirm('¿Borrar el fondo "' + b.name + '" de Mis fondos?')) return;
  try { await db(['bgs', 'bgfiles'], 'readwrite', (m, f) => { m.delete(id); return f.delete(id); }); } catch (err) { return say('No se pudo borrar.'); }
  bgs = bgs.filter(x => x.id !== id);
  if (curBg && curBg.id === id) curBg.id = null;
  for (const sg of songs) if (sg.bgId === id) { sg.bgId = ''; db('songs', 'readwrite', st => st.put(sg)).catch(() => {}); }
  renderBgs(); say('Fondo borrado de Mis fondos.');
};
$('#savecur').onclick = async () => {
  if (curSong) return say('Esta canción ya está guardada.');
  if (!looseFile) return say('Primero abre un MP3 con "Abrir MP3 suelto".');
  const f = looseFile, id = Date.now() + Math.random().toString(36).slice(2, 6);
  const title = $('#title').value.trim() || f.name.replace(/\.[^.]+$/, '');
  try {
    const bgId = curBg ? await saveBgToLib() : '';
    const meta = { id, artist: $('#artist').value.trim(), title, lrc: lrcText, offset, color: $('#col').value, bgType: curBg ? (curBg.isVideo ? 'video' : 'image') : '', bgId, bgS: { ...bgS }, tried: false, added: Date.now() };
    await db(['songs', 'files'], 'readwrite', (m, fl) => { m.put(meta); return fl.put({ id, audio: f, bg: null }); });
    songs.push(meta); curSong = meta; looseFile = null; renderList();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    say('Canción guardada en la biblioteca, con su letra, color y fondo.');
  } catch (err) { say('No se pudo guardar. Puede que no quede espacio.'); }
};
async function playSong(id) {
  const meta = songs.find(x => x.id === id);
  if (!meta) return;
  let rec;
  try { rec = await db('files', 'readonly', st => st.get(id)); } catch (err) {}
  if (!rec) return say('No se encontró el archivo de esta canción.');
  curSong = meta; looseFile = null;
  if (audioUrl) URL.revokeObjectURL(audioUrl);
  audioUrl = URL.createObjectURL(rec.audio);
  a.src = audioUrl;
  $('#artist').value = meta.artist; $('#title').value = meta.title;
  offset = meta.offset || 0; $('#off').textContent = fmtOff();
  setColor(meta.color || '#d9a441');
  Object.assign(bgS, meta.bgS || { fit: 'cover', z: 100, x: 50, y: 50 });
  let ok = false;
  if (meta.bgId) { try { ok = await applyBgId(meta.bgId); } catch (err) {} }
  if (!ok && rec.bg) { curBg = { id: null, blob: rec.bg, isVideo: meta.bgType === 'video', name: 'Fondo de la canción' }; showBg(rec.bg, curBg.isVideo); ok = true; }
  if (!ok) { clearBg(); curBg = null; }
  renderBgs(); syncSliders(); applyBg();
  setLyrics(meta.lrc || '', false);
  renderList();
  a.play().catch(() => {});
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: meta.title, artist: meta.artist });
  if (!meta.lrc && !meta.tried) autoSearch(meta); else say(songName(meta));
}
async function autoSearch(meta) {
  say('Buscando letra…');
  try {
    for (let i = 0; i < 20 && a.readyState < 1; i++) await new Promise(r => setTimeout(r, 100));
    const hit = await fetchLRC((meta.artist + ' ' + meta.title).trim());
    if (curSong !== meta) return;
    if (hit) { setLyrics(hit.syncedLyrics); say('Letra encontrada: ' + hit.artistName + ' – ' + hit.trackName + '.'); }
    else { meta.tried = true; saveMeta(); say('No hay letra sincronizada para esta canción. Carga un .lrc o sincronízala tú mismo.'); }
  } catch (err) { if (curSong === meta) say('No se pudo buscar la letra (¿sin internet?).'); }
}
async function delSong(id) {
  const s = songs.find(x => x.id === id);
  if (!s || !confirm('¿Borrar "' + songName(s) + '" de la biblioteca?')) return;
  try { await db(['songs', 'files'], 'readwrite', (m, f) => { m.delete(id); return f.delete(id); }); } catch (err) { return say('No se pudo borrar.'); }
  songs = songs.filter(x => x.id !== id);
  if (curSong && curSong.id === id) { curSong = null; a.pause(); }
  renderList();
}
function pick(dir) {
  if (!songs.length) return -1;
  const i = songs.findIndex(x => curSong && x.id === curSong.id);
  if ($('#mode').value === 'shuf' && songs.length > 1) { let j; do { j = Math.floor(Math.random() * songs.length); } while (j === i); return j; }
  return i < 0 ? 0 : (i + dir + songs.length) % songs.length;
}
const go = dir => { const k = pick(dir); if (k >= 0) playSong(songs[k].id); };
$('#next').onclick = () => go(1);
$('#prev').onclick = () => go(-1);
a.addEventListener('ended', () => {
  if (!curSong) return;
  const m = $('#mode').value;
  if (m === 'one') { a.currentTime = 0; a.play(); } else if (m !== 'stop') go(1);
});
['#artist', '#title'].forEach(q => $(q).onchange = () => {
  if (!curSong) return;
  curSong.artist = $('#artist').value; curSong.title = $('#title').value;
  db('songs', 'readwrite', st => st.put(curSong)).catch(() => {});
  renderList();
});
if ('mediaSession' in navigator) {
  try { navigator.mediaSession.setActionHandler('nexttrack', () => go(1)); navigator.mediaSession.setActionHandler('previoustrack', () => go(-1)); } catch (err) {}
}
/* ---------- Ajustes, estilos, pulso y pantalla encendida ---------- */
const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch (err) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (err) {} }
};
function saveSettings() { LS.set('canto-ajustes', { spd: $('#spd').value, shade: $('#shd').value, pulse: $('#pulse').value, wake: $('#wake').checked }); }
const cfg = LS.get('canto-ajustes', {});
if (cfg.spd !== undefined) $('#spd').value = cfg.spd;
if (cfg.shade !== undefined) { $('#shd').value = cfg.shade; $('#shade').style.opacity = cfg.shade / 100; }
if (cfg.pulse !== undefined) $('#pulse').value = cfg.pulse;
if (cfg.wake !== undefined) $('#wake').checked = cfg.wake;
$('#spd').onchange = saveSettings;

/* Pantalla encendida */
let wl = null;
async function wakeOn() {
  if (!$('#wake').checked || !('wakeLock' in navigator) || wl) return;
  try { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } catch (err) {}
}
function wakeOff() { if (wl) { wl.release().catch(() => {}); wl = null; } }
a.addEventListener('play', wakeOn);
a.addEventListener('pause', wakeOff);
a.addEventListener('ended', wakeOff);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !a.paused) wakeOn(); });
$('#wake').onchange = () => { if ($('#wake').checked) { if (!a.paused) wakeOn(); } else wakeOff(); saveSettings(); };

/* Pulso: el fondo y el brillo del texto laten con los graves */
let actx = null, an = null, fbuf = null, avgB = 0, pv = 0, lastE = 0;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaElementSource(a);
    an = actx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.6;
    src.connect(an); an.connect(actx.destination);
    fbuf = new Uint8Array(an.frequencyBinCount);
    if (actx.state === 'suspended') actx.resume();
  } catch (err) { actx = null; an = null; }
}
function onPulse() { if (+$('#pulse').value > 0 && !a.paused) initAudio(); saveSettings(); }
$('#pulse').oninput = onPulse;
a.addEventListener('play', () => { if (+$('#pulse').value > 0) initAudio(); });
function react() {
  const k = +$('#pulse').value / 100;
  let target = 0;
  if (k > 0 && an && !a.paused) {
    an.getByteFrequencyData(fbuf);
    let b = 0;
    for (let i = 1; i <= 5; i++) b += fbuf[i];
    b /= 5 * 255;
    avgB = avgB * 0.96 + b * 0.04;
    target = Math.max(0, Math.min(1, (b - avgB) * 4));
  }
  pv = Math.max(target, pv * 0.9);
  const e = pv * k;
  if (e < 0.002 && lastE < 0.002) return;
  lastE = e;
  document.documentElement.style.setProperty('--p', e.toFixed(3));
  bg.style.transform = 'scale(' + (1 + e * 0.05).toFixed(4) + ')';
  bg.style.filter = e < 0.002 ? '' : 'brightness(' + (1 + e * 0.35).toFixed(3) + ')';
  $('#shade').style.opacity = Math.max(0, $('#shd').value / 100 - e * 0.25).toFixed(3);
}

/* Estilos guardados (color, velocidad, oscuridad y pulso) */
let styles = LS.get('canto-estilos', []);
function renderStyles() {
  const sel = $('#sty');
  sel.innerHTML = '';
  const o0 = document.createElement('option');
  o0.value = ''; o0.textContent = styles.length ? 'Mis estilos…' : 'Sin estilos guardados';
  sel.appendChild(o0);
  for (const st of styles) { const o = document.createElement('option'); o.value = st.name; o.textContent = st.name; sel.appendChild(o); }
}
$('#savesty').onclick = () => {
  const name = (prompt('Nombre del estilo:') || '').trim();
  if (!name) return;
  const st = { name, color: $('#col').value, spd: $('#spd').value, shade: $('#shd').value, pulse: $('#pulse').value };
  const i = styles.findIndex(x => x.name === name);
  if (i >= 0) styles[i] = st; else styles.push(st);
  LS.set('canto-estilos', styles); renderStyles(); $('#sty').value = name;
  say('Estilo guardado: ' + name + '.');
};
$('#sty').onchange = e => {
  const st = styles.find(x => x.name === e.target.value);
  if (!st) return;
  setColor(st.color);
  $('#spd').value = st.spd;
  $('#shd').value = st.shade; $('#shade').style.opacity = st.shade / 100;
  $('#pulse').value = st.pulse;
  onPulse(); saveMeta();
  say('Estilo aplicado: ' + st.name + '.');
};
$('#delsty').onclick = () => {
  const name = $('#sty').value;
  if (!name) return say('Elige un estilo en la lista para borrarlo.');
  if (!confirm('¿Borrar el estilo "' + name + '"?')) return;
  styles = styles.filter(x => x.name !== name);
  LS.set('canto-estilos', styles); renderStyles();
  say('Estilo borrado.');
};
renderStyles();

loadSongs();
loadBgs();

/* ---------- Atajos y barra ---------- */
addEventListener('keydown', e => {
  if (['TEXTAREA', 'INPUT'].includes(e.target.tagName)) return;
  if (e.code === 'Space' && sync) { e.preventDefault(); tap(); }
  if (e.key === '[') nudge(-0.5);
  if (e.key === ']') nudge(0.5);
  if (e.key === 'h' || e.key === 'H') bar.classList.contains('hide') ? showBar() : hideBar(true);
});
$('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

let hideT, drag = null, armed = true;
function typing() {
  const t = document.activeElement;
  return t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type === 'text'));
}
function hideBar(force) {
  if (a.paused || sync || typing()) return;
  if (!force && bar.matches(':hover')) { clearTimeout(hideT); hideT = setTimeout(hideBar, 1500); return; }
  if (bar.contains(document.activeElement)) document.activeElement.blur();
  bar.classList.add('hide');
  armed = false;
}
function showBar() {
  bar.classList.remove('hide');
  clearTimeout(hideT);
  hideT = setTimeout(hideBar, 3000);
}
a.addEventListener('play', () => { clearTimeout(hideT); hideT = setTimeout(() => hideBar(true), 700); });
a.addEventListener('pause', showBar);
addEventListener('mousemove', e => {
  const inZone = e.clientY > innerHeight - bar.offsetHeight - 20;
  if (!inZone) armed = true;
  else if (armed) showBar();
});

/* Arrastrar el fondo; un toque corto muestra u oculta el panel */
addEventListener('pointerdown', e => {
  if (bar.contains(e.target)) return;
  drag = { x: e.clientX, y: e.clientY, sx: bgS.x, sy: bgS.y, moved: false };
});
addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
  if (drag.moved && bg.firstElementChild) {
    bgS.x = clamp(drag.sx - dx / innerWidth * 100 / (bgS.z / 100));
    bgS.y = clamp(drag.sy - dy / innerHeight * 100 / (bgS.z / 100));
    syncSliders(); applyBg();
  }
});
addEventListener('pointerup', () => {
  if (drag && !drag.moved) bar.classList.contains('hide') ? showBar() : hideBar(true);
  else if (drag && drag.moved) saveMeta();
  drag = null;
});
addEventListener('pointercancel', () => { drag = null; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
